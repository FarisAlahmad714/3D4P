{% extends 'base.html' %}

{% block title %}Bad Request - 3D4P{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-page">
                <h1 class="display-1 text-info">400</h1>
                <h2 class="mb-4">Bad Request</h2>
                <p class="lead mb-4">
                    The request could not be understood by the server due to malformed syntax.
                </p>
                <div class="mb-4">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg me-3">
                        <i class="fas fa-home"></i> Go Home
                    </a>
                    <button onclick="window.history.back()" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    padding: 80px 0;
}
.display-1 {
    font-size: 8rem;
    font-weight: bold;
}
</style>
{% endblock %}
