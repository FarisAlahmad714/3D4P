{% extends 'base.html' %}

{% block title %}Page Not Found - 3D4P{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-page">
                <h1 class="display-1 text-primary">404</h1>
                <h2 class="mb-4">Page Not Found</h2>
                <p class="lead mb-4">
                    Sorry, the page you're looking for doesn't exist or has been moved.
                </p>
                <div class="mb-4">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg me-3">
                        <i class="fas fa-home"></i> Go Home
                    </a>
                    <a href="{% url 'donation_list' %}" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-hand-holding-heart"></i> Browse Requests
                    </a>
                </div>
                <div class="mt-5">
                    <p class="text-muted">
                        If you believe this is an error, please <a href="#">contact support</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    padding: 80px 0;
}
.display-1 {
    font-size: 8rem;
    font-weight: bold;
    color: #007bff;
}
</style>
{% endblock %}
